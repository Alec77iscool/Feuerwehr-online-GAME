<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feuerwehr Einsatzleitung</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="app">
    <!-- HAUPTMENÜ -->
    <section id="mainMenu" class="screen active">
      <div class="menu-background">
        <div class="menu-content">
          <div class="logo">
            <div class="logo-fire">🔥</div>
            <h1>FEUERWEHR</h1>
            <span>EINSATZLEITUNG</span>
          </div>

          <button id="freeGameBtn" class="main-button">
            🚒 Freies Spiel
          </button>
          <button id="missionSelectBtn" class="main-button secondary">
            🚨 Einsatz-Auswahl
          </button>

          <div class="version">Version 0.1</div>
        </div>
      </div>
    </section>

    <!-- EINSATZAUSWAHL -->
    <section id="missionMenu" class="screen">
      <div class="topbar">
        <button id="backFromMissions">← Zurück</button>
        <h2>Einsatz-Auswahl</h2>
      </div>
      <div id="missionList" class="mission-list"></div>
    </section>

    <!-- SPIEL -->
    <section id="gameScreen" class="screen">
      <div id="gameUI">
        <div class="top-hud">
          <div>
            <strong>🚒 Feuerwache</strong>
          </div>

          <div id="gameStatus">
            Wache bereit
          </div>

          <div>
            <button id="backToMenu">Menü</button>
          </div>
        </div>

        <div id="timerPanel" class="timer-panel hidden">
          <span>Nächster Einsatz</span>
          <strong id="freeTimer">04:00</strong>
        </div>

        <div id="missionInfo" class="mission-info hidden">
          <strong id="missionTitle"></strong>
          <span id="missionDescription"></span>
        </div>

        <!-- SPIELWELT -->
        <div id="worldViewport">
          <div id="world">
            <!-- Straßen -->
            <div class="road road-horizontal road-1"></div>
            <div class="road road-horizontal road-2"></div>
            <div class="road road-vertical road-3"></div>

            <!-- WACHE -->
            <div id="station" class="station">
              <div class="station-sign">
                🚒 FEUERWACHE
              </div>

              <div class="station-building">
                <div class="office">
                  <span>LEITSTELLE</span>
                </div>

                <div id="garage" class="garage">
                  <div class="garage-roof">
                    FAHRZEUGHALLE
                  </div>

                  <div class="garage-doors">
                    <div class="garage-door" data-door="1">
                      <div class="door-label">TOR 1</div>
                    </div>
                    <div class="garage-door" data-door="2">
                      <div class="door-label">TOR 2</div>
                    </div>
                    <div class="garage-door" data-door="3">
                      <div class="door-label">TOR 3</div>
                    </div>
                    <div class="garage-door" data-door="4">
                      <div class="door-label">TOR 4</div>
                    </div>
                  </div>

                  <div id="vehicleArea"></div>
                </div>

                <div class="station-yard">
                  <div class="yard-label">WACHHOF</div>
                </div>
              </div>
            </div>

            <!-- BÄUME -->
            <div class="tree t1">🌳</div>
            <div class="tree t2">🌲</div>
            <div class="tree t3">🌳</div>
            <div class="tree t4">🌲</div>
            <div class="tree t5">🌳</div>

            <!-- EINSATZORT -->
            <div id="missionLocation" class="mission-location hidden">
              <div class="building-fire">🔥</div>
              <div class="mission-marker">EINSATZ</div>
            </div>
          </div>
        </div>

        <!-- MELDER -->
        <div id="pager" class="pager hidden">
          <div class="pager-light"></div>

          <div class="pager-screen">
            <div>🚨 EINSATZ</div>
            <strong id="pagerMission"></strong>
          </div>

          <button id="pagerButton">
            MELDER BESTÄTIGEN
          </button>
        </div>

        <!-- FAHRZEUGMENÜ -->
        <div id="vehiclePanel" class="vehicle-panel hidden">
          <div class="vehicle-panel-header">
            <strong id="selectedVehicleName"></strong>
            <button id="closeVehiclePanel">×</button>
          </div>

          <div id="vehicleActions"></div>
        </div>

        <!-- STEUERUNG -->
        <div class="controls">
          <div>
            <strong>Kamera</strong>
            <span>WASD / Pfeiltasten</span>
          </div>

          <div>
            <strong>Zoom</strong>
            <span>Mausrad</span>
          </div>

          <div>
            <strong>Fahrzeug</strong>
            <span>Anklicken</span>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script src="game.js"></script>
</body>
</html>
